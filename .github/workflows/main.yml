name: Main pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: main-production
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run full Chromium suite locally
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
        run: npx playwright test --project=chromium --grep-invert '@quarantine'
      - name: Upload full-suite report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-test-report
          path: playwright-report/
          retention-days: 14

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production_url }}
    outputs:
      production_url: ${{ steps.deploy.outputs.production_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@65.9.0
      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production
        env:
          NITRO_PRESET: vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Verify Vercel build output
        run: |
          test -f .vercel/output/config.json
          test -d .vercel/output/static
          test -d .vercel/output/functions
      - name: Deploy production and expose URL
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          production_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          if [[ ! "$production_url" =~ ^https://[^[:space:]]+\.vercel\.app$ ]]; then
            echo "::error::Vercel did not return a valid production deployment URL"
            exit 1
          fi
          echo "production_url=$production_url" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$production_url" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify deployed production with smoke tests
        env:
          BASE_URL: ${{ needs.deploy-production.outputs.production_url }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --project=chromium --grep '@smoke' --grep-invert '@quarantine'
      - name: Upload production smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: playwright-report/
          retention-days: 14
